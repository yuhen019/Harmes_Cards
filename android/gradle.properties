# 本机内存 16G，模板默认 -Xmx8G + MaxMetaspace4G 会把 aapt2 子进程挤到 OOM，
# 表现为 verifyReleaseResources 随机在不同模块上失败（错误信息只有一个文件路径）。
# 所以堆压到 3G、限制并发，宁可慢一点也要稳。
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
org.gradle.parallel=false

android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin 增量编译缓存曾损坏（Could not close incremental caches），关掉更稳
kotlin.incremental=false
