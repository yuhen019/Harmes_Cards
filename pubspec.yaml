name: hermes_cards
description: Hermes Cards - 小清新卡片学习工具
publish_to: 'none'
version: 0.3.0+3

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # 本地数据：JSON 单文件存储（无原生依赖，桌面/移动端行为一致）
  # 注：原用 sqflite，但桌面端缺少 sqlite3 原生库（sqlite3_flutter_libs 已废弃为空包），
  #     Windows 构建产物打不开数据库，故改为 JSON 存储。
  path: ^1.9.0
  path_provider: ^2.1.3
  # 状态管理
  provider: ^6.1.2
  # 文件选择与文档导入
  file_picker: ^8.0.0
  # 导出/导入
  share_plus: ^9.0.0
  # 工具
  uuid: ^4.4.0
  intl: ^0.19.0
  # 图表
  fl_chart: ^0.68.0
  # 富文本/公式渲染
  flutter_math_fork: ^0.7.2
  fast_gbk: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

# path_provider_android 2.3.x 引入了 jni（带 CMake 原生构建），
# 会让 Android 构建强制依赖 NDK + CMake（各几百 MB，国内网络下极易卡在解压）。
# 本应用只需要一个应用文档目录，钉在纯 Kotlin 实现的 2.2.x。
dependency_overrides:
  path_provider_android: 2.2.23
