<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermes Cards · 原型演示</title>
<style>
:root{
  --mint:#5DCAA5; --mint-d:#1D9E75; --mint-l:#E1F5EE;
  --blue:#7FB8E6; --blue-l:#EAF4FB;
  --cream:#FFFCF5; --paper:#FFFFFF;
  --ink:#2C3A36; --ink-2:#6B7A75; --ink-3:#9AA7A2;
  --line:#ECEFED; --line-2:#DFE4E1;
  --coral:#F0997B; --amber:#EF9F27; --red:#E24B4A;
  --radius:18px;
  --font:"PingFang SC","Microsoft YaHei","Segoe UI",-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font);color:var(--ink);
  background:#F3FAF7;
  display:flex;align-items:center;justify-content:center;
  padding:24px;-webkit-font-smoothing:antialiased;
}
button{font-family:var(--font);border:none;cursor:pointer;background:none;color:inherit;font-size:inherit}
input,textarea{font-family:var(--font);outline:none;border:none;background:none;color:inherit;font-size:inherit}
::-webkit-scrollbar{width:0;height:0}

.device{position:relative;background:var(--paper);border-radius:34px;box-shadow:0 8px 30px rgba(44,58,54,.12);overflow:hidden;width:390px;height:760px;max-height:92vh;display:flex;flex-direction:column}
.statusbar{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:12px;color:var(--ink);flex-shrink:0}
.appname{height:52px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;flex-shrink:0;color:var(--ink);border-bottom:1px solid var(--line)}
.view{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 20px 20px}
.tabbar{height:70px;flex-shrink:0;display:flex;background:var(--paper);border-top:1px solid var(--line);align-items:center;justify-content:space-around;padding:0 8px}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:var(--ink-3);padding:6px 12px;border-radius:12px;cursor:pointer}
.tab.active{color:var(--mint-d)}
.tab .ticon{font-size:22px;line-height:1}

.greeting{font-size:13px;color:var(--ink-2);margin:18px 0 2px}
.hero{font-size:22px;font-weight:800;margin-bottom:18px;line-height:1.3}
.sec-title{font-size:16px;font-weight:700;margin:8px 0 12px;color:var(--ink)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius)}
.chip{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 14px;border-radius:999px;font-size:12px;background:var(--paper);border:1px solid var(--line-2);color:var(--ink-2);cursor:pointer}

.todaycard{background:#5DCAA5;color:#fff;border-radius:20px;padding:20px;margin-bottom:20px;position:relative;overflow:hidden}
.todaycard .t-label{font-size:12px;opacity:.92}
.todaycard .t-num{font-size:40px;font-weight:800;line-height:1;margin:8px 0 4px}
.todaycard .t-sub{font-size:12px;opacity:.88}
.btn-start{margin-top:16px;background:#fff;color:var(--mint-d);font-weight:700;font-size:14px;padding:12px 0;border-radius:14px;width:100%;text-align:center;cursor:pointer}

.deckgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.deck{border-radius:18px;padding:16px;border:1px solid var(--line);background:var(--paper);cursor:pointer;position:relative;overflow:hidden}
.deck:active{transform:scale(.97)}
.deck .d-emoji{font-size:26px;line-height:1;margin-bottom:10px}
.deck .d-name{font-size:14px;font-weight:700;margin-bottom:2px}
.deck .d-meta{font-size:11px;color:var(--ink-3)}
.deck .d-bar{height:5px;border-radius:3px;background:var(--line);margin-top:12px;overflow:hidden}
.deck .d-bar i{display:block;height:100%;border-radius:3px}
.deck .d-due{position:absolute;top:12px;right:12px;font-size:10px;font-weight:700;padding:3px 7px;border-radius:999px}

.study-top{display:flex;align-items:center;justify-content:space-between;padding:16px 0 14px}
.backbtn{width:36px;height:36px;border-radius:12px;background:var(--cream);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--ink);cursor:pointer}
.study-progress{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-bottom:8px}
.study-progress i{display:block;height:100%;background:var(--mint);border-radius:3px;transition:.3s}
.study-count{font-size:12px;color:var(--ink-3);text-align:center;margin-bottom:14px}

.flipwrap{perspective:1200px;margin-bottom:20px}
.flipcard{position:relative;width:100%;height:330px;transform-style:preserve-3d;transition:transform .5s;cursor:pointer}
.flipcard.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center;border:1px solid var(--line);box-shadow:0 6px 20px rgba(44,58,54,.08)}
.face.front{background:var(--paper)}
.face.back{background:#F2FBF7;transform:rotateY(180deg)}
.face .f-tag{position:absolute;top:18px;left:20px;font-size:11px;color:var(--ink-3);background:var(--cream);padding:4px 10px;border-radius:999px;border:1px solid var(--line)}
.face .f-q{font-size:21px;font-weight:700;line-height:1.5;color:var(--ink)}
.face .f-a{font-size:16px;line-height:1.7;color:var(--ink)}
.face .f-hint{margin-top:18px;font-size:12px;color:var(--ink-3)}

.rating{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.rate{display:flex;flex-direction:column;align-items:center;gap:6px;padding:13px 0;border-radius:14px;border:1px solid var(--line);background:var(--paper);font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer}
.rate:active{transform:scale(.95)}
.rate .r-dot{width:10px;height:10px;border-radius:50%}
.rate.again .r-dot{background:var(--red)}
.rate.hard .r-dot{background:var(--amber)}
.rate.good .r-dot{background:var(--mint)}
.rate.easy .r-dot{background:var(--blue)}
.rate .r-sub{font-size:9px;color:var(--ink-3);font-weight:400}

.study-done{text-align:center;padding:60px 20px}
.study-done .big{font-size:54px;margin-bottom:16px}
.study-done h3{font-size:20px;font-weight:800;margin-bottom:8px}
.study-done p{font-size:13px;color:var(--ink-2);line-height:1.7}

.detail-title{display:flex;align-items:center;gap:12px;margin:14px 0 4px}
.detail-title .em{font-size:30px}
.detail-title h2{font-size:20px;font-weight:800}
.detail-stats{display:flex;gap:10px;margin:14px 0 18px}
.mini-stat{flex:1;background:var(--cream);border-radius:14px;padding:12px;text-align:center}
.mini-stat .v{font-size:18px;font-weight:800}
.mini-stat .k{font-size:10px;color:var(--ink-3);margin-top:2px}
.study-btn{width:100%;background:var(--mint-d);color:#fff;font-weight:700;font-size:15px;padding:14px 0;border-radius:16px;margin-bottom:18px;cursor:pointer;text-align:center}
.cl-title{font-size:13px;color:var(--ink-2);margin:6px 0 10px;font-weight:600}
.carditem{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--paper);margin-bottom:8px;cursor:pointer}
.carditem .qmark{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0}
.carditem .ctext{flex:1;min-width:0}
.carditem .cq{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.carditem .cm{font-size:10px;color:var(--ink-3);margin-top:3px}

.ed-field{margin-bottom:16px}
.ed-field label{font-size:12px;color:var(--ink-2);font-weight:600;display:block;margin-bottom:8px}
.ed-input{width:100%;border:1px solid var(--line-2);border-radius:12px;padding:12px 14px;font-size:14px;background:var(--paper)}
.ed-textarea{min-height:100px;resize:none;line-height:1.6}

.wiz-step{display:flex;gap:6px;margin:10px 0 20px}
.wiz-step .s{flex:1;height:4px;border-radius:2px;background:var(--line)}
.wiz-step .s.on{background:var(--mint)}
.dropzone{border:2px dashed var(--mint);border-radius:18px;padding:40px 20px;text-align:center;background:var(--mint-l);color:var(--mint-d);margin-bottom:16px;cursor:pointer}
.dropzone .ico{font-size:36px;margin-bottom:10px}
.dropzone h3{font-size:15px;font-weight:700;margin-bottom:4px}
.dropzone p{font-size:12px;opacity:.85}
.opt-card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.opt-card .opt-head{font-size:13px;font-weight:700;margin-bottom:10px}
.opt-row{display:flex;gap:8px;flex-wrap:wrap}
.opt-pill{padding:8px 14px;border-radius:999px;border:1px solid var(--line-2);font-size:12px;color:var(--ink-2);background:var(--paper);cursor:pointer}
.opt-pill.sel{background:var(--mint-l);border-color:transparent;color:var(--mint-d);font-weight:700}
.gen-preview{max-height:300px;overflow-y:auto;border:1px solid var(--line);border-radius:14px;margin-bottom:14px}
.gen-item{display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:flex-start}
.gen-item:last-child{border-bottom:none}
.gen-item .gidx{width:20px;height:20px;border-radius:6px;background:var(--mint-l);color:var(--mint-d);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
.gen-item .gq{font-size:12px;font-weight:600;line-height:1.5}
.gen-item .ga{font-size:11px;color:var(--ink-2);line-height:1.5;margin-top:3px}

.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.stat-box{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px}
.stat-box .sv{font-size:26px;font-weight:800}
.stat-box .sk{font-size:11px;color:var(--ink-3);margin-top:4px}
.heatmap{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px}
.heatmap h4{font-size:13px;font-weight:700;margin-bottom:12px}
.hm-row{display:flex;gap:4px;margin-bottom:5px;align-items:center}
.hm-label{font-size:9px;color:var(--ink-3);width:24px;text-align:right;margin-right:3px;flex-shrink:0}
.hm-cell{width:13px;height:13px;border-radius:3px;background:var(--line);flex-shrink:0}
.hm-legend{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--ink-3);margin-top:10px;justify-content:flex-end}

.set-group{margin-bottom:20px}
.set-group h4{font-size:12px;color:var(--ink-3);font-weight:600;margin:0 0 4px 4px}
.set-item{display:flex;align-items:center;justify-content:space-between;padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.set-item:last-child{border-bottom:none}
.set-item .si-l{font-size:14px}
.set-item .si-sub{font-size:11px;color:var(--ink-3);margin-top:2px}
.set-item .si-r{color:var(--ink-3);font-size:13px;display:flex;align-items:center;gap:4px}
.toggle{width:46px;height:26px;border-radius:999px;background:var(--line-2);position:relative;cursor:pointer}
.toggle.on{background:var(--mint)}
.toggle i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff}
.toggle.on i{left:23px}
.slider{width:100%;accent-color:var(--mint)}

.overlay{position:absolute;inset:0;background:rgba(30,40,36,.45);display:none;z-index:50}
.overlay.show{display:flex;align-items:flex-end}
.sheet{background:var(--paper);width:100%;border-radius:24px 24px 0 0;padding:20px 20px 28px;max-height:80%}
.sheet .grabber{width:40px;height:4px;border-radius:2px;background:var(--line-2);margin:0 auto 16px}
.sheet h3{font-size:16px;font-weight:700;margin-bottom:14px}
.sheet-row{padding:14px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;font-size:14px;cursor:pointer}
.sheet-row:last-child{border-bottom:none}
.sheet-row .ic{font-size:20px}
.sheet-row .arr{margin-left:auto;color:var(--ink-3)}

.toast{position:absolute;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;padding:10px 18px;border-radius:999px;opacity:0;transition:.3s;z-index:99;white-space:nowrap;pointer-events:none}
.toast.show{opacity:1}

.demo-badge{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.9);border:1px solid var(--line);color:var(--ink-2);font-size:12px;padding:8px 16px;border-radius:999px;white-space:nowrap;z-index:10}
</style>
</head>
<body>
<div class="device">
  <div class="statusbar">
    <span>9:41</span>
    <span style="font-weight:600">Hermes Cards</span>
    <span style="width:40px"></span>
  </div>
  <div class="view" id="view"></div>
  <div class="tabbar" id="tabbar"></div>
  <div class="overlay" id="overlay" onclick="closeSheet(event)">
    <div class="sheet" id="sheet"></div>
  </div>
  <div class="toast" id="toast"></div>
</div>
<div class="demo-badge">Hermes Cards · 可交互原型演示</div>

<script>
var decks = [
  { id:1, emoji:'📚', name:'雅思核心词汇', color:'#5DCAA5', total:248, learned:186, due:32, nw:12, tags:'英语' },
  { id:2, emoji:'🧬', name:'人体解剖学', color:'#7FB8E6', total:156, learned:98, due:18, nw:0, tags:'医学' },
  { id:3, emoji:'⚖️', name:'法理学 · 民法', color:'#F0997B', total:120, learned:40, due:7, nw:15, tags:'法律' },
  { id:4, emoji:'💻', name:'算法与数据结构', color:'#AFA9EC', total:89, learned:89, due:0, nw:0, tags:'编程' },
  { id:5, emoji:'📖', name:'认知心理学笔记', color:'#ED93B1', total:64, learned:20, due:9, nw:8, tags:'读书' },
  { id:6, emoji:'🇯🇵', name:'日语 N2 文法', color:'#97C459', total:203, learned:150, due:41, nw:20, tags:'语言' }
];

var cardsPool = {
  1: [
    {q:'"ambiguous" 是什么意思？', a:'模棱两可的；含糊不清的\n例：an ambiguous answer', tag:'词汇'},
    {q:'"resilient" 的含义与近义词？', a:'有韧性的、能迅速恢复的\n近义：tough, flexible', tag:'词汇'},
    {q:'"mitigate" 的意思是？', a:'缓解、减轻（不良影响）\n例：mitigate the risk', tag:'词汇'}
  ],
  2: [
    {q:'人体最大的器官是什么？', a:'皮肤（Skin），成人面积约 1.5~2 ㎡', tag:'解剖'},
    {q:'心脏的四个腔室分别是？', a:'左心房、左心室、右心房、右心室', tag:'解剖'},
    {q:'成人骨骼总数约为？', a:'206 块', tag:'解剖'}
  ],
  3: [
    {q:'"法无禁止即可为" 体现了什么原则？', a:'私法自治 / 意思自治原则（针对民事主体）', tag:'法理'},
    {q:'民法的调整对象是？', a:'平等主体之间的财产关系与人身关系', tag:'民法'}
  ],
  4: [
    {q:'快速排序的平均时间复杂度？', a:'O(n log n)，最坏 O(n²)', tag:'算法'},
    {q:'栈和队列的核心区别？', a:'栈 LIFO（后进先出），队列 FIFO（先进先出）', tag:'结构'}
  ],
  5: [
    {q:'"主动回忆" 为什么有效？', a:'检索本身会强化记忆痕迹，比反复阅读更牢固', tag:'原理'},
    {q:'艾宾浩斯遗忘曲线说明了什么？', a:'记忆随时间指数衰减，需在遗忘临界点复习', tag:'原理'}
  ],
  6: [
    {q:'「〜わけにはいかない」的意思？', a:'不能…、不可以…（受道义/情理约束）', tag:'文法'},
    {q:'「〜てたまらない」表达什么？', a:'…得不得了（强烈的感情/欲望）', tag:'文法'}
  ]
};

var genCards = [
  {q:'间隔重复的核心原理是什么？', a:'在即将遗忘的时刻复习，间隔逐次拉长以强化长期记忆'},
  {q:'主动回忆与被动重读的区别？', a:'主动回忆需先自行提取答案，记忆效果显著优于重复阅读'},
  {q:'FSRS 算法中 "稳定性" 指什么？', a:'记忆可提取率从 100% 降到 90% 所需的天数'},
  {q:'莱特纳盒系统如何运作？', a:'卡片按掌握程度分入不同盒子，答对升盒、答错降盒'}
];

var currentTab = 'home';
var studyDeck = null;
var studyCards = [];
var studyIdx = 0;
var flipped = false;
var wizStep = 1;
var wizOpts = { density:'均衡', detail:'标准', type:'混合' };
var stats = { streak:6, reviewed:1240, total:573, retention:91 };

var $view = document.getElementById('view');
var $tabbar = document.getElementById('tabbar');
var $sheet = document.getElementById('sheet');
var $overlay = document.getElementById('overlay');
var $toast = document.getElementById('toast');

function el(html){ var d=document.createElement('div'); d.innerHTML=html; return d.firstChild; }

function renderTabbar(){
  var tabs = [
    {key:'home', label:'学习', icon:'🏠'},
    {key:'stats', label:'统计', icon:'📊'},
    {key:'import', label:'导入', icon:'📥'},
    {key:'settings', label:'我的', icon:'👤'}
  ];
  var h='';
  tabs.forEach(function(t){
    h += '<div class="tab '+(currentTab===t.key?'active':'')+'" onclick="switchTab(\''+t.key+'\')"><span class="ticon">'+t.icon+'</span><span>'+t.label+'</span></div>';
  });
  $tabbar.innerHTML = h;
}

function switchTab(key){ currentTab=key; renderTabbar(); renderView(); }

function renderView(){
  if(currentTab==='home') renderHome();
  else if(currentTab==='study') renderStudy();
  else if(currentTab==='done') renderDone();
  else if(currentTab==='deck') renderDeck();
  else if(currentTab==='edit') renderEdit();
  else if(currentTab==='stats') renderStats();
  else if(currentTab==='import') renderImport();
  else if(currentTab==='settings') renderSettings();
  $view.scrollTop=0;
}

function renderHome(){
  var dueTotal=0, newTotal=0;
  decks.forEach(function(d){ dueTotal+=d.due; newTotal+=d.nw; });
  var h='';
  h += '<div class="greeting">下午好，宇痕</div>';
  h += '<div class="hero">今天也要元气满满地复习 🌿</div>';
  h += '<div class="todaycard">';
  h += '<div class="t-label">今日待复习</div>';
  h += '<div class="t-num">'+dueTotal+'</div>';
  h += '<div class="t-sub">另有 '+newTotal+' 张新卡待学习 · 连续打卡 '+stats.streak+' 天</div>';
  h += '<div class="btn-start" onclick="startStudyAll()">开始学习</div>';
  h += '</div>';
  h += '<div class="sec-title">我的卡包</div>';
  h += '<div class="deckgrid">';
  decks.forEach(function(d){
    var pct=Math.round(d.learned/d.total*100);
    var due = d.due>0 ? '<span class="d-due" style="background:'+d.color+'33;color:'+d.color+'">'+d.due+'待复习</span>' : '';
    h += '<div class="deck" onclick="openDeck('+d.id+')">'+due+
      '<div class="d-emoji">'+d.emoji+'</div>'+
      '<div class="d-name">'+d.name+'</div>'+
      '<div class="d-meta">'+d.total+' 张 · '+d.tags+'</div>'+
      '<div class="d-bar"><i style="width:'+pct+'%;background:'+d.color+'"></i></div>'+
      '</div>';
  });
  h += '</div>';
  $view.innerHTML=h;
}

function startStudyAll(){
  studyDeck=null; studyCards=[]; studyIdx=0; flipped=false;
  decks.forEach(function(d){ if(d.due>0||d.nw>0){ (cardsPool[d.id]||[]).forEach(function(c){ studyCards.push(c); }); } });
  if(studyCards.length===0) studyCards=genCards.slice();
  currentTab='study'; renderView();
}
function startStudyDeck(id){
  var d=decks.find(function(x){return x.id===id;});
  studyDeck=d; studyCards=(cardsPool[id]||[]).slice(); studyIdx=0; flipped=false;
  currentTab='study'; renderView();
}
function flip(){
  flipped=!flipped;
  var fc=document.getElementById('flipcard');
  if(fc) fc.className = flipped ? 'flipcard flipped' : 'flipcard';
}
function rate(g){
  studyIdx++; flipped=false;
  if(studyIdx>=studyCards.length){ currentTab='done'; renderView(); return; }
  renderStudy();
}
function renderStudy(){
  var c=studyCards[studyIdx];
  var pct=Math.round(studyIdx/studyCards.length*100);
  var title=studyDeck?studyDeck.name:'今日全部';
  var h='';
  h += '<div class="study-top"><div class="backbtn" onclick="exitStudy()">✕</div>';
  h += '<div style="font-size:13px;font-weight:700;flex:1;text-align:center">'+title+'</div>';
  h += '<div style="width:36px"></div></div>';
  h += '<div class="study-progress"><i style="width:'+pct+'%"></i></div>';
  h += '<div class="study-count">'+(studyIdx+1)+' / '+studyCards.length+'</div>';
  h += '<div class="flipwrap"><div class="flipcard" id="flipcard" onclick="flip()">';
  h += '<div class="face front"><span class="f-tag">'+title+'</span><div class="f-q">'+c.q+'</div><div class="f-hint">点击卡片查看答案</div></div>';
  h += '<div class="face back"><span class="f-tag">答案</span><div class="f-a">'+c.a.replace(/\n/g,'<br>')+'</div></div>';
  h += '</div></div>';
  h += '<div class="rating">';
  h += '<div class="rate again" onclick="rate(0)"><span class="r-dot"></span>重来<span class="r-sub">忘了</span></div>';
  h += '<div class="rate hard" onclick="rate(1)"><span class="r-dot"></span>困难<span class="r-sub">模糊</span></div>';
  h += '<div class="rate good" onclick="rate(2)"><span class="r-dot"></span>良好<span class="r-sub">想起</span></div>';
  h += '<div class="rate easy" onclick="rate(3)"><span class="r-dot"></span>简单<span class="r-sub">秒答</span></div>';
  h += '</div>';
  $view.innerHTML=h;
}
function exitStudy(){ currentTab='home'; renderView(); }

function renderDone(){
  var h='';
  h += '<div class="study-done">';
  h += '<div class="big">🎉</div>';
  h += '<h3>太棒了，全部完成！</h3>';
  h += '<p>本轮共复习 '+studyCards.length+' 张卡片<br>记忆就是这样一点点变牢固的</p>';
  h += '<div class="btn-start" style="background:var(--mint-d);color:#fff;margin:24px auto 0;max-width:260px" onclick="switchTab(\'home\')">返回首页</div>';
  h += '<div class="btn-start" style="margin:12px auto 0;max-width:260px;background:var(--cream);color:var(--ink-2)" onclick="switchTab(\'stats\')">查看统计</div>';
  h += '</div>';
  $view.innerHTML=h;
}

var deckCache=null;
function openDeck(id){
  var d=decks.find(function(x){return x.id===id;});
  deckCache=d;
  var cards=cardsPool[id]||[];
  var pct=Math.round(d.learned/d.total*100);
  var colors=['#5DCAA5','#7FB8E6','#F0997B','#AFA9EC'];
  var h='';
  h += '<div class="study-top"><div class="backbtn" onclick="switchTab(\'home\')">‹</div>';
  h += '<div style="flex:1"></div><div style="width:36px"></div></div>';
  h += '<div class="detail-title"><span class="em">'+d.emoji+'</span>';
  h += '<div><h2>'+d.name+'</h2><div style="font-size:12px;color:var(--ink-3)">'+d.tags+' · '+d.total+' 张卡片</div></div></div>';
  h += '<div class="detail-stats">';
  h += '<div class="mini-stat"><div class="v" style="color:'+d.color+'">'+d.due+'</div><div class="k">待复习</div></div>';
  h += '<div class="mini-stat"><div class="v">'+d.nw+'</div><div class="k">新卡片</div></div>';
  h += '<div class="mini-stat"><div class="v">'+pct+'%</div><div class="k">掌握度</div></div>';
  h += '</div>';
  h += '<div class="study-btn" onclick="startStudyDeck('+id+')">开始复习这个卡包</div>';
  h += '<div class="cl-title">全部卡片（'+cards.length+'）</div>';
  cards.forEach(function(c,i){
    var col=colors[i%4];
    h += '<div class="carditem" onclick="openEdit('+id+','+i+')">';
    h += '<div class="qmark" style="background:'+col+'33;color:'+col+'">Q</div>';
    h += '<div class="ctext"><div class="cq">'+c.q+'</div><div class="cm">'+c.tag+' · 下次复习：'+(i+1)+'天后</div></div>';
    h += '</div>';
  });
  $view.innerHTML=h;
}

function openEdit(deckId, idx){
  var c=cardsPool[deckId][idx];
  var h='';
  h += '<div class="study-top"><div class="backbtn" onclick="openDeck('+deckId+')">‹</div>';
  h += '<div style="font-size:16px;font-weight:700;flex:1;text-align:center">编辑卡片</div><div style="width:36px"></div></div>';
  h += '<div class="ed-field"><label>正面 · 问题</label><textarea class="ed-input ed-textarea" id="eq">'+c.q+'</textarea></div>';
  h += '<div class="ed-field"><label>反面 · 答案</label><textarea class="ed-input ed-textarea" id="ea">'+c.a+'</textarea></div>';
  h += '<div class="ed-field"><label>标签</label><input class="ed-input" id="et" value="'+c.tag+'"></div>';
  h += '<div class="study-btn" onclick="toast(\'已保存（演示）\')">保存卡片</div>';
  h += '<div class="chip" style="width:100%;color:var(--red)" onclick="toast(\'已删除（演示）\')">删除卡片</div>';
  $view.innerHTML=h;
}

function renderImport(){
  var h='';
  h += '<div class="greeting">导入文档</div>';
  h += '<div class="hero" style="font-size:20px">把资料变成卡片</div>';
  h += '<div class="wiz-step">';
  for(var i=1;i<=3;i++){ h += '<div class="s '+(wizStep>=i?'on':'')+'"></div>'; }
  h += '</div><div id="wizBody"></div>';
  $view.innerHTML=h;
  renderWizBody();
}
function renderWizBody(){
  var body=document.getElementById('wizBody');
  if(!body) return;
  if(wizStep===1){
    body.innerHTML='';
    body.innerHTML='<div class="dropzone" onclick="toast(\'选择文件…（演示）\')"><div class="ico">📄</div><h3>点击上传文档</h3><p>支持 PDF / Word / Markdown / 纯文本</p></div>';
    body.innerHTML+='<div class="opt-card"><div class="opt-head">也可以直接粘贴文本</div><textarea class="ed-input ed-textarea" placeholder="粘贴你的学习材料…"></textarea></div>';
    body.innerHTML+='<div class="chip" style="width:100%">近期文档：认知心理学.pdf</div>';
    body.innerHTML+='<div class="study-btn" onclick="wizNext()">下一步</div>';
  } else if(wizStep===2){
    body.innerHTML='';
    body.innerHTML+=optBlock('卡片密度',['精简','均衡','详细'],'density');
    body.innerHTML+=optBlock('答案详细度',['简洁','标准','详细'],'detail');
    body.innerHTML+=optBlock('卡片类型',['问答','填空','选择','混合'],'type');
    body.innerHTML+='<div class="study-btn" onclick="wizNext()">生成卡片</div>';
  } else {
    body.innerHTML='';
    body.innerHTML='<div class="greeting" style="margin-bottom:8px">已生成 '+genCards.length+' 张卡片，预览确认</div>';
    body.innerHTML+='<div class="gen-preview">';
    genCards.forEach(function(c,i){
      body.innerHTML+='<div class="gen-item"><div class="gidx">'+(i+1)+'</div><div><div class="gq">'+c.q+'</div><div class="ga">'+c.a+'</div></div></div>';
    });
    body.innerHTML+='</div>';
    body.innerHTML+='<div class="study-btn" onclick="toast(\'已导入为「认知心理学」卡包（演示）\');wizStep=1;switchTab(\'home\')">确认导入卡包</div>';
    body.innerHTML+='<div class="chip" style="width:100%" onclick="wizStep=1;renderWizBody()">重新生成</div>';
  }
}
function optBlock(title, opts, key){
  var h='<div class="opt-card"><div class="opt-head">'+title+'</div><div class="opt-row">';
  opts.forEach(function(o){
    h+='<div class="opt-pill '+(wizOpts[key]===o?'sel':'')+'" onclick="setOpt(\''+key+'\',\''+o+'\')">'+o+'</div>';
  });
  h+='</div></div>';
  return h;
}
function setOpt(k,v){ wizOpts[k]=v; renderWizBody(); }
function wizNext(){ if(wizStep<3){ wizStep++; renderWizBody(); } }

function renderStats(){
  var h='';
  h += '<div class="greeting">学习统计</div>';
  h += '<div class="hero" style="font-size:20px">坚持是最酷的事 ✨</div>';
  h += '<div class="stat-grid">';
  h += '<div class="stat-box"><div class="sv" style="color:var(--mint-d)">'+stats.streak+'</div><div class="sk">连续打卡（天）</div></div>';
  h += '<div class="stat-box"><div class="sv">'+stats.reviewed+'</div><div class="sk">累计复习（张）</div></div>';
  h += '<div class="stat-box"><div class="sv" style="color:var(--blue)">'+stats.total+'</div><div class="sk">卡片总数</div></div>';
  h += '<div class="stat-box"><div class="sv" style="color:var(--coral)">'+stats.retention+'%</div><div class="sk">保持率</div></div>';
  h += '</div>';
  h += '<div class="heatmap"><h4>复习热力图 · 近 12 周</h4>'+heatmapHTML()+'</div>';
  h += '<div class="stat-box"><div style="font-size:13px;font-weight:700;margin-bottom:12px">每日复习量（近 7 天）</div>'+barsHTML()+'</div>';
  $view.innerHTML=h;
}
function heatmapHTML(){
  var rows=['一','三','五','日'];
  var colors=['#ECEFED','#B8E8D6','#7DD5B4','#3BB08A','#1D9E75'];
  var h='';
  rows.forEach(function(r){
    h+='<div class="hm-row"><span class="hm-label">'+r+'</span>';
    for(var w=0;w<12;w++){ var v=Math.floor(Math.random()*5); h+='<div class="hm-cell" style="background:'+colors[v]+'"></div>'; }
    h+='</div>';
  });
  h+='<div class="hm-legend">少 <span style="background:#ECEFED;width:12px;height:12px;border-radius:3px;display:inline-block"></span> <span style="background:#1D9E75;width:12px;height:12px;border-radius:3px;display:inline-block"></span> 多</div>';
  return h;
}
function barsHTML(){
  var days=['一','二','三','四','五','六','日'];
  var vals=[42,68,35,90,55,120,0];
  var max=120;
  var h='<div style="display:flex;align-items:flex-end;gap:10px;height:90px">';
  days.forEach(function(d,i){
    var bg = (i===5)?'var(--mint-d)':'var(--mint)';
    var op = vals[i]===0?0.15:1;
    h+='<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px">';
    h+='<div style="width:100%;max-width:22px;background:'+bg+';border-radius:6px 6px 3px 3px;height:'+Math.max(4,vals[i]/max*80)+'px;opacity:'+op+'"></div>';
    h+='<div style="font-size:9px;color:var(--ink-3)">'+d+'</div></div>';
  });
  h+='</div>';
  return h;
}

function renderSettings(){
  var h='';
  h += '<div class="greeting">我的</div>';
  h += '<div class="hero" style="font-size:20px">设置</div>';
  h += '<div class="set-group"><h4>学习偏好</h4><div class="card" style="padding:0 16px">';
  h += '<div class="set-item"><div class="si-l">目标保持率<div class="si-sub">想记多牢（越高复习越勤）</div></div><div class="si-r"><span class="range-val" id="rv">90%</span></div></div>';
  h += '<input type="range" class="slider" min="70" max="97" value="90" style="margin:0 0 14px" oninput="document.getElementById(\'rv\').textContent=this.value+\'%\'">';
  h += '<div class="set-item"><div class="si-l">每日新卡上限<div class="si-sub">防止积压</div></div><div class="si-r">20 张</div></div>';
  h += '<div class="set-item"><div class="si-l">每日复习上限</div><div class="si-r">200 张</div></div>';
  h += '<div class="set-item" onclick="toast(\'深色模式（演示）\')"><div class="si-l">深色模式</div><div class="si-r"><div class="toggle"><i></i></div></div></div>';
  h += '<div class="set-item" onclick="toast(\'翻面动画（演示）\')"><div class="si-l">翻面动画</div><div class="si-r"><div class="toggle on"><i></i></div></div></div>';
  h += '</div></div>';
  h += '<div class="set-group"><h4>数据</h4><div class="card" style="padding:0 16px">';
  h += '<div class="set-item" onclick="openSync()"><div class="si-l">导出学习数据包<div class="si-sub">手动同步到其他设备</div></div><div class="si-r">›</div></div>';
  h += '<div class="set-item" onclick="openSync()"><div class="si-l">导入学习数据包</div><div class="si-r">›</div></div>';
  h += '<div class="set-item"><div class="si-l">兼容格式导出<div class="si-sub">Anki / CSV / Markdown</div></div><div class="si-r">›</div></div>';
  h += '</div></div>';
  h += '<div class="set-group"><h4>关于</h4><div class="card" style="padding:0 16px">';
  h += '<div class="set-item"><div class="si-l">版本</div><div class="si-r">v0.1 原型</div></div>';
  h += '<div class="set-item"><div class="si-l">算法</div><div class="si-r">FSRS</div></div>';
  h += '</div></div>';
  $view.innerHTML=h;
}
function openSync(){
  $sheet.innerHTML='<div class="grabber"></div><h3>手动同步</h3>';
  $sheet.innerHTML+='<div class="sheet-row" onclick="toast(\'已生成数据包 HermesCards-1025.zip（演示）\');closeSheet()"><span class="ic">📤</span>导出学习数据包<span class="arr">›</span></div>';
  $sheet.innerHTML+='<div class="sheet-row" onclick="toast(\'已选择数据包（演示）\');closeSheet()"><span class="ic">📥</span>从文件导入<span class="arr">›</span></div>';
  $sheet.innerHTML+='<div class="sheet-row" onclick="toast(\'局域网同步（后续）\');closeSheet()"><span class="ic">🔗</span>局域网直连<span class="arr">›</span></div>';
  $overlay.className='overlay show';
}
function closeSheet(e){ if(e && e.target !== $overlay) return; $overlay.className='overlay'; }

var toastTimer;
function toast(msg){
  $toast.textContent=msg;
  $toast.className='toast show';
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ $toast.className='toast'; }, 1800);
}

renderTabbar();
renderView();
</script>
</body>
</html>
